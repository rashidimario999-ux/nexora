<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora Login</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; }
    #msg { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Log in to Nexora</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="btn">Log in</button>
  <div id="msg"></div>
  <script>
    document.getElementById("btn").onclick = async function () {
      var msg = document.getElementById("msg");
      msg.textContent = "Please wait...";
      try {
        var res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        var data = await res.json();
        msg.textContent = data.ok ? "Welcome back, " + data.email : data.error;
      } catch (e) {
        msg.textContent = "Could not reach the server.";
      }
    };
  </script>
</body>
    </html>
