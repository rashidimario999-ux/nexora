<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products</title>
<style>
body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 0 12px; }
input, textarea, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
#msg { margin: 12px 0; font-weight: bold; }
.card { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 10px 0; }
.shop { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h2>Add a Product</h2>
<input id="email" type="email" placeholder="Your email">
<input id="password" type="password" placeholder="Your password">
<input id="name" type="text" placeholder="Product name">
<textarea id="description" rows="3" placeholder="Description"></textarea>
<input id="price" type="number" step="0.01" placeholder="Price">
<input id="currency" type="text" placeholder="Currency (e.g. USD)" value="USD">
<button onclick="addProduct()">Add product</button>
<div id="msg"></div>

<h2>All Products</h2>
<button onclick="loadProducts()">Refresh list</button>
<div id="list"></div>

<script>
async function addProduct() {
  var msg = document.getElementById("msg");
  msg.textContent = "Please wait...";
  try {
    var res = await fetch("/api/add-product", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        name: document.getElementById("name").value,
        description: document.getElementById("description").value,
        price: document.getElementById("price").value,
        currency: document.getElementById("currency").value
      })
    });
    var data = await res.json();
    msg.textContent = data.ok ? "Product added: " + data.name : data.error;
    if (data.ok) { loadProducts(); }
  } catch (e) {
    msg.textContent = "Could not connect.";
  }
}

async function loadProducts() {
  var list = document.getElementById("list");
  list.textContent = "Loading...";
  try {
    var res = await fetch("/api/products");
    var data = await res.json();
    if (!data.ok) { list.textContent = data.error; return; }
    if (data.products.length === 0) { list.textContent = "No products yet."; return; }
    list.innerHTML = "";
    data.products.forEach(function (p) {
      var card = document.createElement("div");
      card.className = "card";
      var title = document.createElement("strong");
      title.textContent = p.name + " - " + p.price + " " + p.currency;
      var desc = document.createElement("div");
      desc.textContent = p.description || "";
      var shop = document.createElement("div");
      shop.className = "shop";
      shop.textContent = "Sold by " + p.shop_name + " (" + (p.country || "") + ")";
      card.appendChild(title);
      card.appendChild(desc);
      card.appendChild(shop);
      list.appendChild(card);
    });
  } catch (e) {
    list.textContent = "Could not connect.";
  }
}

loadProducts();
</script>
</body>
  </html>
