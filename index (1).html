@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const STOP=['the','for','find','show','want','need','looking','under','below','and','with','any','some','best','good','buy','get','please','cheap','than','less','you','can','are','what','which','how','have','does','this','that','from','all','new','max'];

/* ---------- State (saved in the browser) ---------- */
Object.assign(S,{bal:0,vip:false,cart:{},cc:'',claimed:['WELCOME10'],recent:[],mine:[],sort:'rel',ai:[],tid:'sup',
orders:[
{id:'NX10482',items:[[1,1]],total:49.99,fixed:3,date:'Nov 2, 2026'},
{id:'NX10517',items:[[2,1],[4,1]],total:114.98,fixed:2,date:'Nov 12, 2026'}],
th:{
sup:{n:'Nexora Support',u:3,m:[['a','Welcome to Nexora! How can we help you today?'],['a','Tip: claim vouchers in the Voucher Center and apply them in your cart.'],['a','Our team usually replies within a few minutes.']]},
tech:{n:'TechHub Store',u:5,m:[['a','Hi Mario, thanks for your interest in TechHub Store.'],['a','Our NEX phones are on a 50% sale this week.'],['a','Free shipping on orders over $50.'],['a','Ask us anything about specs or stock.'],['a','We ship worldwide within 24 hours.']]}}});
const KEYS=['bal','vip','cart','cc','orders','claimed','recent','mine','th'];
try{Object.assign(S,JSON.parse(localStorage.getItem('nx2')||'{}'))}catch(e){}
const save2=()=>{try{localStorage.setItem('nx2',JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,S[k]]))))}catch(e){}};
S.mine.forEach(p=>P.push(p));
Object.defineProperty(S,'ms',{get:()=>Object.values(S.th).reduce((a,x)=>a+x.u,0),set(){},configurable:true});
let SF=0,typing=0;

/* ---------- Search ---------- */
const om=main;
function results(){
const w=S.q.trim().toLowerCase().split(/\s+/);
const r=P.filter(p=>w.every(x=>(p.n+' '+p.c).toLowerCase().includes(x)));
if(S.sort=='lo')r.sort((a,b)=>a.p-b.p);
if(S.sort=='hi')r.sort((a,b)=>b.p-a.p);
if(S.sort=='rt')r.sort((a,b)=>b.r-a.r);
return r}
const sug=()=>`<div class="sgp">${S.recent.length?`<div><div class="rh"><b>Recent searches</b><button class="lk" data-a="clr">Clear</button></div><div class="chips">${S.recent.map(x=>`<button class="chip" data-a="sq" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:''}<div><b>Trending</b><div class="chips" style="margin-top:8px">${['Earbuds','Watch','Phone','Speaker','Sports'].map(x=>`<button class="chip" data-a="sq" data-q="${x}">${x}</button>`).join('')}</div></div></div>`;
main=function(){
const q=S.q.trim(),m=$('#main');
if(q){const r=results();
m.innerHTML=`<div class="rh"><b>${r.length} result${r.length==1?'':'s'} for “${esc(q)}”</b><select id="so" aria-label="Sort"><option value="rel">Best match</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="rt">Top rated</option></select></div>`+grid(r);
$('#so').value=S.sort}
else if(SF)m.innerHTML=sug();
else om()};

/* ---------- Cart ---------- */
const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
function totals(){
let sub=0;
for(const id in S.cart){const p=find(id);if(p)sub+=p.p*S.cart[id]}
const cp=CP.find(c=>c.c==S.cc);
let dc=0,ship=(sub>50||sub==0)?0:4.99;
if(cp){if(cp.t=='pct')dc=sub*cp.v/100;else if(cp.t=='amt'&&sub>=(cp.min||0))dc=cp.v;else if(cp.t=='ship')ship=0}
const vd=S.vip?sub*.05:0;
return{sub:r2(sub),dc:r2(dc),vd:r2(vd),ship,total:r2(Math.max(0,sub-dc-vd+ship))}}
window.after=function(){
let b=$('#cp');
if(!b){b=document.createElement('button');b.id='cp';b.dataset.a='go';b.dataset.v='page';b.dataset.x='cart';$('#app').appendChild(b)}
const n=cartN();
b.hidden=!n||(S.v=='page'&&S.x=='cart');
b.innerHTML=`${ic('cart')}<span>${n} item${n>1?'s':''} · ${money(totals().total)}</span><b>View cart</b>`;
if(S.v=='page'&&(S.x=='ai'||S.x=='th'))scrollEnd()};
function scrollEnd(){const m=$('#main');m.scrollTop=m.scrollHeight}

/* ---------- Modal ---------- */
function modal(h){
let m=$('#md');
if(!m){m=document.createElement('div');m.id='md';$('#app').appendChild(m)}
m.innerHTML=`<div class="mb2" data-a="mc"></div><div class="mc" role="dialog" aria-modal="true">${h}<button class="lo" data-a="mc">Close</button></div>`;
m.hidden=false}
const closeModal=()=>{const m=$('#md');if(m)m.hidden=true};
function addFunds(v){
if(!(v>0&&v<=1000))return toast('Enter an amount from 1 to 1000');
S.bal=r2(S.bal+v);save2();closeModal();toast('Added '+money(v)+' to your balance');all()}

/* ---------- Chat helpers ---------- */
const mini=p=>p?`<div class="mp"><div class="mt">${art(p)}</div><div><b>${esc(p.n)}</b><span>${money(p.p)} <s>${money(p.o)}</s></span></div><button class="hrt mh${S.w.includes(p.id)?' on':''}" data-a="wish" data-id="${p.id}" aria-label="Wishlist: ${esc(p.n)}"><i>${ic('heart')}</i></button><button class="add" data-a="cart" data-id="${p.id}" aria-label="Add to cart: ${esc(p.n)}">${ic('cart')}</button></div>`:'';
const bub=m=>`<div class="bb ${m[0]}">${esc(m[1])}${m[2]&&m[2].length?`<div class="mps">${m[2].map(id=>mini(find(id))).join('')}</div>`:''}</div>`;
const chatPage=(title,back,msgs,quick,form)=>pg(title,`<div class="cl" id="cl">${msgs.map(bub).join('')}</div>${quick?`<div class="chips">${quick.map(q=>`<button class="chip" data-a="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}<form class="cf" id="${form}"><input name="m" autocomplete="off" placeholder="Type a message…" aria-label="Message"><button class="sg1" aria-label="Send">${ic('arr','fl')}</button></form>`,back);
function curMsgs(){
if(S.v!='page')return null;
if(S.x=='ai')return S.ai;
if(S.x=='th'&&S.th[S.tid])return S.th[S.tid].m;
return null}
function paint(){
const c=$('#cl'),m=curMsgs();
if(!c||!m)return;
c.innerHTML=m.map(bub).join('')+(typing&&S.x=='ai'?'<div class="bb a mut">Typing…</div>':'');
scrollEnd()}

/* ---------- AI assistant (runs inside the app, no server) ---------- */
function aiReply(q){
const s=q.toLowerCase();
const mx=(s.match(/(?:under|below|less than|max|<)\s*\$?(\d+)/)||[])[1];
const terms=s.split(/[^a-z]+/).filter(w=>w.length>2&&!STOP.includes(w)).map(w=>w.replace(/(es|s)$/,''));
const pool=P.filter(p=>!mx||p.p<=+mx);
const hits=terms.length?pool.filter(p=>terms.some(w=>w.length>2&&(p.n+' '+p.c).toLowerCase().includes(w))):[];
const under=mx?` under ${money(+mx)}`:'';
if(hits.length)return[`Found ${hits.length} match${hits.length>1?'es':''}${under}:`,hits.slice(0,4).map(p=>p.id)];
if(mx&&!terms.length)return pool.length?[`Here are products${under}:`,pool.slice(0,4).map(p=>p.id)]:[`I couldn't find anything${under}.`];
const rules=[
[/^(hi|hello|hey|hola)\b/,()=>['Hi Mario! I can find products, show deals, track orders or explain coupons. What do you need?']],
[/order|track|deliver|ship/,()=>{const o=S.orders[0];return[o?`Your latest order ${o.id} is "${STEPS[stp(o)]}". Open My Orders for the full tracker.`:'You have no orders yet. Add something to your cart and check out!']}],
[/coupon|voucher|promo|code/,()=>[`You have ${S.claimed.length} coupon(s): ${S.claimed.join(', ')||'none'}. Claim more in the Voucher Center, then pick one in your cart.`]],
[/wish|saved|favou?rite/,()=>[S.w.length?`You saved ${S.w.length} item(s):`:'Your wishlist is empty. Tap the heart on any product to save it.',S.w.slice(0,3)]],
[/balance|wallet|top ?up|money|fund/,()=>[`Your balance is ${money(S.bal)}. Use Top Up in the menu to add funds.`]],
[/vip|member/,()=>[S.vip?'You are a VIP member and get 5% off every order.':'VIP members get 5% off every order. Tap Join Now on the Home screen to join.']],
[/refund|return|support|problem|complain/,()=>['For returns or refunds, open Help & Support and chat with our team.']],
[/deal|discount|sale|offer/,()=>["Here are today's biggest discounts:",[...P].sort((a,b)=>b.d-a.d).slice(0,3).map(p=>p.id)]]];
for(const [re,fn] of rules)if(re.test(s))return fn();
return['I can search products (try "earbuds under $60"), show deals, track orders and explain coupons.']}
function aiSend(text){
S.ai.push(['u',text]);typing=1;paint();
setTimeout(()=>{const r=aiReply(text);S.ai.push(['a',r[0],r[1]]);typing=0;paint()},650)}

/* ---------- Orders ---------- */
const stp=o=>o.fixed!=null?o.fixed:Math.min(3,Math.floor((Date.now()-o.at)/20000));

/* ---------- Pages ---------- */
const PG={
ai:()=>{
if(!S.ai.length)S.ai.push(['a','Hi Mario! I\'m your Nexora assistant. Ask me to find products, check deals, track an order or explain coupons.']);
return chatPage(t('ai'),'home',S.ai,['Show me deals','Find earbuds under $60','Track my order','My coupons'],'af')},
th:()=>chatPage(S.th[S.tid].n,'page" data-x="msgs',S.th[S.tid].m,null,'tf'),
msgs:()=>pg(t('msgs'),Object.entries(S.th).map(([id,x])=>{const l=x.m[x.m.length-1];return`<button class="tr" data-a="th" data-id="${id}"><span class="av">${ic('chat')}</span><span class="tx"><b>${esc(x.n)}</b><span>${esc(l?l[1]:'')}</span></span>${x.u?`<span class="n2">${x.u}</span>`:''}</button>`}).join('')),
noti:()=>pg('Notifications',NT.map(n=>`<div class="sec nt"><span class="ci3">${ic(n[0])}</span><div><b>${n[1]}</b><span>${n[2]}</span></div></div>`).join('')),
cart:()=>{
const ids=Object.keys(S.cart).filter(id=>find(id));
if(!ids.length)return pg('My Cart',`<div class="em"><span class="ci">${ic('cart')}</span>Your cart is empty.<button class="go" data-a="go" data-v="home">Start shopping</button></div>`);
const T=totals();
return pg('My Cart',`<div class="sec">${ids.map(id=>{const p=find(id);return`<div class="cr"><div class="mt">${art(p)}</div><div class="ci2"><b>${esc(p.n)}</b><span>${money(p.p)}</span></div><div class="qt"><button data-a="qm" data-id="${id}" aria-label="Decrease">−</button><b>${S.cart[id]}</b><button data-a="qp" data-id="${id}" aria-label="Increase">+</button></div></div>`}).join('')}</div>
<div class="sec"><h3 class="h3">Coupon</h3><select id="cs" aria-label="Coupon"><option value="">No coupon</option>${S.claimed.map(c=>`<option${c==S.cc?' selected':''}>${c}</option>`).join('')}</select></div>
<div class="sec tt"><p><span>Subtotal</span><span>${money(T.sub)}</span></p>${T.dc?`<p><span>Coupon</span><span>−${money(T.dc)}</span></p>`:''}${T.vd?`<p><span>VIP 5%</span><span>−${money(T.vd)}</span></p>`:''}<p><span>Shipping</span><span>${T.ship?money(T.ship):'Free'}</span></p><p class="gt"><span>Total</span><b>${money(T.total)}</b></p><p class="mut">Balance: ${money(S.bal)}</p><button class="go" data-a="pay">Place order</button></div>`)},
orders:()=>pg(t('orders'),S.orders.length?S.orders.map((o,i)=>{const s=stp(o);return`<details class="sec od"${i?'':' open'}><summary><b>${o.id}</b><span class="st s${s}">${STEPS[s]}</span><small>${o.date} · ${money(o.total)}</small></summary>${o.items.map(([id,q])=>{const p=find(id);return`<p class="oi">${p?esc(p.n):'Removed item'} × ${q}</p>`}).join('')}<ol class="trk">${STEPS.map((x,j)=>`<li class="${j<=s?'done':''}">${x}</li>`).join('')}</ol></details>`}).join(''):`<div class="em"><span class="ci">${ic('box')}</span>No orders yet.</div>`),
coup:()=>{
const mine=CP.filter(c=>S.claimed.includes(c.c)),rest=CP.filter(c=>!S.claimed.includes(c.c));
return pg(t('coup'),`<section><h3 class="h3">My coupons</h3>${mine.length?mine.map(c=>`<div class="cpn"><div><b>${c.c}</b><span>${c.d}</span></div><button class="chip" data-a="use" data-c="${c.c}">Use</button></div>`).join(''):'<p class="mut">No coupons yet. Claim one below.</p>'}</section><section><h3 class="h3">${t('vouch')}</h3>${rest.length?rest.map(c=>`<div class="cpn"><div><b>${c.c}</b><span>${c.d}</span></div><button class="chip" data-a="claim" data-c="${c.c}">Claim</button></div>`).join(''):'<p class="mut">You claimed every voucher.</p>'}</section>`)},
sell:()=>pg(t('sell'),`<div class="sec stt"><p><b>${S.mine.length}</b>Listings</p><p><b>${S.orders.length}</b>Orders</p></div><form class="sec fm" id="sf2"><h3 class="h3">List a new product</h3><label>Name<input name="n" required maxlength="40"></label><label>Price ($)<input name="p" type="number" step="0.01" min="0.5" required></label><label>Original price ($)<input name="o" type="number" step="0.01" min="0.5" required></label><label>Category<select name="c"><option>Electronics</option><option>Fashion</option><option>Home</option><option>Sports</option></select></label><label>Picture style<select name="a"><option value="phone">Phone</option><option value="watch">Watch</option><option value="bud">Earbuds</option><option value="spk">Speaker</option></select></label><button class="go">Publish product</button></form><section class="sec"><h3 class="h3">My listings</h3>${S.mine.length?S.mine.map(p=>`<div class="lr"><span>${esc(p.n)} · ${money(p.p)}</span><button class="chip" data-a="del" data-id="${p.id}">Remove</button></div>`).join(''):'<p class="mut">Nothing listed yet.</p>'}</section>`),
help:()=>pg(t('help'),`<section class="sec">${[['How do I track my order?','Open My Orders in the menu. Each order shows a step-by-step tracker.'],['How do I use a coupon?','Claim it in the Voucher Center, then choose it in your cart before you place the order.'],['How do I add money?','Tap Top Up in the menu or on your Account page and pick an amount.'],['How do returns work?','Chat with support below and share your order number.']].map(f=>`<details class="faq"><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</section><button class="go" data-a="th" data-id="sup">Chat with support</button>`),
about:()=>pg(t('about'),`<div class="em"><span class="ci">${ic('globe')}</span><b>Nexora Market AI</b><span>Version 1.0.0<br>The world at your fingertips.<br>© 2026 Nexora Technologies</span></div>`)};
V.page=()=>PG[S.x]?PG[S.x]():V.home();
</script>
<script>
/* ---------- Actions ---------- */
const ACT={
cart:d=>{S.cart[d.id]=(S.cart[d.id]||0)+1;save2();toast(t('cart'));after()},
qp:d=>{S.cart[d.id]++;save2();main();after()},
qm:d=>{if(--S.cart[d.id]<=0)delete S.cart[d.id];save2();main();after()},
pay:()=>{
if(!cartN())return;
const T=totals();
if(S.bal<T.total){toast('Not enough balance. Top up first.');return ACT.topup()}
S.bal=r2(S.bal-T.total);
S.orders.unshift({id:'NX'+(10000+Math.floor(Math.random()*89999)),items:Object.keys(S.cart).filter(id=>find(id)).map(id=>[+id,S.cart[id]]),total:T.total,at:Date.now(),date:new Date().toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})});
S.cart={};S.cc='';save2();toast('Order placed!');go('page','orders')},
sq:d=>{closeModal();S.q=d.q;SF=0;S.recent=[d.q,...S.recent.filter(x=>x!=d.q)].slice(0,6);save2();head();main()},
clr:()=>{S.recent=[];save2();main()},
claim:d=>{if(!S.claimed.includes(d.c))S.claimed.push(d.c);save2();toast('Coupon claimed');main()},
use:d=>{S.cc=d.c;save2();toast('Coupon selected');go('page','cart')},
topup:()=>modal(`<h3>Top up balance</h3><p class="mut">Current balance: ${money(S.bal)}. Demo only: no real payment is taken.</p><div class="chips">${[10,25,50,100].map(v=>`<button class="chip" data-a="tp" data-v="${v}">+$${v}</button>`).join('')}</div><form id="tuf" class="cf"><input name="a" type="number" min="1" max="1000" step="1" placeholder="Custom amount" aria-label="Custom amount"><button class="sg1" aria-label="Add funds">${ic('check')}</button></form>`),
tp:d=>addFunds(+d.v),
mc:closeModal,
join:()=>{
if(S.vip)return toast('You are already a VIP member');
modal(`<h3>Join Nexora VIP</h3><p class="mut">Get 5% off every order. One-time fee $9.99, paid from your balance (demo).</p><p>Balance: <b>${money(S.bal)}</b></p><button class="go" data-a="vipgo">Join for $9.99</button>`)},
vipgo:()=>{
if(S.bal<9.99){closeModal();toast('Not enough balance. Top up first.');return ACT.topup()}
S.bal=r2(S.bal-9.99);S.vip=true;save2();closeModal();toast('Welcome to Nexora VIP!');all()},
th:d=>{S.tid=d.id;S.th[d.id].u=0;save2();go('page','th')},
ask:d=>aiSend(d.q),
del:d=>{
const id=+d.id,i=P.findIndex(p=>p.id==id);
if(i>-1)P.splice(i,1);
S.mine=S.mine.filter(p=>p.id!=id);S.w=S.w.filter(x=>x!=id);delete S.cart[id];
save();save2();toast('Listing removed');main();nav();drawer();after()},
cam:()=>{
let f=$('#cf');
if(!f){
f=document.createElement('input');f.type='file';f.accept='image/*';f.id='cf';f.hidden=true;$('#app').appendChild(f);
f.addEventListener('change',()=>{
const file=f.files[0];if(!file)return;
modal(`<h3>Search by photo</h3><img class="pv" src="${URL.createObjectURL(file)}" alt="Your photo"><p class="mut">Automatic photo recognition is not connected yet. Pick what you are looking for:</p><div class="chips">${['Earbuds','Watch','Phone','Speaker'].map(x=>`<button class="chip" data-a="sq" data-q="${x}">${x}</button>`).join('')}</div>`);
f.value=''})}
f.click()}};
document.addEventListener('click',e=>{
const el=e.target.closest('[data-a]');if(!el)return;
const f=ACT[el.dataset.a];if(f)f(el.dataset,el)});

/* ---------- Forms & inputs ---------- */
document.addEventListener('submit',e=>{
const f=e.target,v=n=>f.elements[n]?f.elements[n].value.trim():'';
if(f.id=='sf'){const q=S.q.trim();if(q){S.recent=[q,...S.recent.filter(x=>x!=q)].slice(0,6);save2()}}
else if(f.id=='af'){const m=v('m');if(m){f.reset();aiSend(m)}}
else if(f.id=='tf'){
const m=v('m');if(!m)return;
const id=S.tid;f.reset();
S.th[id].m.push(['u',m]);save2();paint();
setTimeout(()=>{
S.th[id].m.push(['a',id=='sup'?'Thanks for reaching out! We noted your message and will follow up shortly.':'Hi! Yes, that item is in stock and ships within 24 hours.']);
if(S.v=='page'&&S.x=='th'&&S.tid==id)paint();else{S.th[id].u++;drawer()}
save2()},900)}
else if(f.id=='tuf'){addFunds(+v('a'))}
else if(f.id=='sf2'){
const n=v('n'),p=+v('p'),o=+v('o');
if(!n||!(p>0)||!(o>0))return toast('Fill in all fields');
if(o<=p)return toast('Original price must be higher than price');
const item={id:Date.now()%1000000000,n,p:r2(p),o:r2(o),d:Math.max(1,Math.round((1-p/o)*100)),r:4.5,k:'New',a:v('a'),c:v('c')};
P.push(item);S.mine.push(item);save2();toast('Product published');main()}});
document.addEventListener('change',e=>{
if(e.target.id=='so'){S.sort=e.target.value;main()}
if(e.target.id=='cs'){S.cc=e.target.value;save2();main();after()}});
document.addEventListener('focusin',e=>{if(e.target.id=='q'&&!S.q.trim()){SF=1;main()}});
document.addEventListener('focusout',e=>{if(e.target.id=='q')setTimeout(()=>{if(SF){SF=0;if(!S.q.trim())main()}},300)});
document.addEventListener('mousedown',e=>{if(e.target.closest('#main .chip,#main .lk'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});

/* ---------- Make the old buttons use the new features ---------- */
document.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
let k='';
if(b.matches('.add'))k='cart';
else if(b.dataset.a=='bell')k='bell';
else if(b.closest('.bl'))k='topup';
else if(b.closest('.vip'))k='join';
else if(b.closest('.sb')&&b.classList.contains('btn'))k='cam';
if(!k)return;
e.stopImmediatePropagation();
if(k=='cart')ACT.cart({id:b.dataset.id||b.closest('.card').querySelector('.hrt').dataset.id});
else if(k=='bell'){S.nt=0;go('page','noti')}
else ACT[k]()},true);
let busy=0;
function fix(){
busy=1;
document.querySelectorAll('.bl b').forEach(x=>x.textContent=money(S.bal));
document.querySelectorAll('.vip button').forEach(x=>x.textContent=S.vip?'VIP ✓':t('join'));
after();
obs.takeRecords();busy=0}
const obs=new MutationObserver(()=>{if(!busy)fix()});
obs.observe(document.getElementById('app'),{childList:true,subtree:true});
fix();
</script>
<script src="ai.js"></script>
</body>
</html>
